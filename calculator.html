<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cost Splitter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.4s ease;
}

body.dark-mode {
    background: linear-gradient(135deg, #121212, #1a1a1a, #242424);
}

.calculator-wrapper {
    background: rgba(255, 255, 255, 0.95);
    padding: 45px 40px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    width: 420px;
    backdrop-filter: blur(12px);
    position: relative;
    transition: all 0.4s ease;
}

body.dark-mode .calculator-wrapper {
    background: rgba(30, 30, 30, 0.95);
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
}

.theme-btn {
    position: absolute;
    top: 25px;
    right: 25px;
    background: #f8f9fa;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: transform 0.3s, background 0.4s;
}

body.dark-mode .theme-btn {
    background: #2c2c2c;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.theme-btn:hover {
    transform: scale(1.1);
}

.calculator-wrapper h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 35px;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    transition: all 0.4s ease;
}

body.dark-mode .calculator-wrapper h2 {
    background: linear-gradient(135deg, #bb86fc, #03dac6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
}

.input-row {
    display: flex;
    gap: 15px;
}

.input-field {
    margin-bottom: 22px;
    flex: 1;
}

.input-field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #2c5364;
    margin-bottom: 8px;
    transition: color 0.4s ease;
}

body.dark-mode .input-field label {
    color: #bb86fc;
}

.input-field input {
    width: 100%;
    padding: 15px;
    border: 2px solid #e9ecef;
    border-radius: 12px;
    box-sizing: border-box;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Poppins', sans-serif;
    color: #1a1a1a;
    background-color: #f8f9fa;
    transition: all 0.3s ease;
}

.input-field select {
    width: 100%;
    padding: 15px;
    border: 2px solid #e9ecef;
    border-radius: 12px;
    box-sizing: border-box;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Poppins', sans-serif;
    color: #1a1a1a;
    background-color: #f8f9fa;
    transition: all 0.3s ease;
}

body.dark-mode .input-field input {
    background-color: #2c2c2c;
    border-color: #3d3d3d;
    color: #ffffff;
}

body.dark-mode .input-field select {
    background-color: #2c2c2c;
    border-color: #3d3d3d;
    color: #ffffff;
}

.input-field input:focus {
    outline: none;
    border-color: #2c5364;
    background-color: #ffffff;
    box-shadow: 0 5px 15px rgba(44, 83, 100, 0.1);
}

.input-field select:focus {
    outline: none;
    border-color: #2c5364;
    background-color: #ffffff;
    box-shadow: 0 5px 15px rgba(44, 83, 100, 0.1);
}

body.dark-mode .input-field input:focus {
    border-color: #bb86fc;
    background-color: #1a1a1a;
    box-shadow: 0 5px 15px rgba(187, 134, 252, 0.15);
}

body.dark-mode .input-field select:focus {
    border-color: #bb86fc;
    background-color: #1a1a1a;
    box-shadow: 0 5px 15px rgba(187, 134, 252, 0.15);
}

.action-btn {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, #203a43, #2c5364);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.4s ease;
    font-family: 'Poppins', sans-serif;
    letter-spacing: 1px;
    margin-top: 10px;
}

body.dark-mode .action-btn {
    background: linear-gradient(135deg, #bb86fc, #3700b3);
}

.action-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(44, 83, 100, 0.4);
}

body.dark-mode .action-btn:hover {
    box-shadow: 0 10px 25px rgba(187, 134, 252, 0.3);
}

.result-box {
    margin-top: 25px;
    padding: 22px;
    border-radius: 16px;
    background: #ffffff;
    border: 2px solid #e9ecef;
    display: none;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    transition: all 0.4s ease;
}

body.dark-mode .result-box {
    background: #242424;
    border-color: #3d3d3d;
}

.result-box p {
    margin: 0 0 5px 0;
    font-size: 15px;
    font-weight: 600;
    color: #6c757d;
    transition: color 0.4s ease;
}

body.dark-mode .result-box p {
    color: #a0a0a0;
}

.result-box h3 {
    margin: 0;
    font-size: 34px;
    color: #1a1a1a;
    font-weight: 700;
    transition: color 0.4s ease;
}

body.dark-mode .result-box h3 {
    color: #ffffff;
}

.alert-msg {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    display: none;
    transition: all 0.4s ease;
}

.alert-warning {
    background: #ffe5e5;
    color: #d32f2f;
    border: 1px solid #ffcdd2;
}

body.dark-mode .alert-warning {
    background: rgba(211, 47, 47, 0.15);
    color: #ff5252;
    border-color: rgba(255, 82, 82, 0.3);
}

.alert-success {
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #c8e6c9;
}

body.dark-mode .alert-success {
    background: rgba(46, 125, 50, 0.15);
    color: #69f0ae;
    border-color: rgba(105, 240, 174, 0.3);
}

.alert-health {
    margin-top: 15px;
    padding: 14px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    border: 1px solid #c8e6c9;
    background: #e8f5e9;
    color: #2e7d32;
}

.alert-health.tight {
    background: #fff8e1;
    color: #ef6c00;
    border-color: #ffecb3;
}

.alert-health.risky {
    background: #ffe5e5;
    color: #d32f2f;
    border-color: #ffcdd2;
}

.score-meter {
    height: 9px;
    background: #e9ecef;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
}

.score-meter span {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: #2e7d32;
}

body.dark-mode .alert-health {
    background: rgba(46, 125, 50, 0.15);
    color: #69f0ae;
    border-color: rgba(105, 240, 174, 0.3);
}

body.dark-mode .alert-health.tight {
    background: rgba(239, 108, 0, 0.15);
    color: #ffb74d;
    border-color: rgba(255, 183, 77, 0.3);
}

body.dark-mode .alert-health.risky {
    background: rgba(211, 47, 47, 0.15);
    color: #ff5252;
    border-color: rgba(255, 82, 82, 0.3);
}
</style>
</head>
<body>

<div class="calculator-wrapper">
    <button class="theme-btn" id="theme-toggle" onclick="switchTheme()">🌙</button>
    
    <h2>Rent & Cost Splitter</h2>
    
    <div class="input-row">
        <div class="input-field">
            <label>Total Rent</label>
            <input type="number" id="rent" placeholder="e.g. 15000" required>
        </div>
        <div class="input-field">
            <label>Utilities (Bills)</label>
            <input type="number" id="utilities" placeholder="e.g. 3000" required>
        </div>
    </div>

    <div class="input-field">
        <label>Number of Roommates</label>
        <input type="number" id="roommates" placeholder="e.g. 3" required min="1" oninput="renderCustomSplitFields()">
    </div>

    <div class="input-field">
        <label>Split Mode</label>
        <select id="split-mode" onchange="renderCustomSplitFields()">
            <option value="equal">Equal Split</option>
            <option value="custom">Custom Split</option>
        </select>
    </div>

    <div id="custom-split-fields" class="input-row" style="flex-wrap: wrap;"></div>

    <div class="input-row">
        <div class="input-field">
            <label>Your Income</label>
            <input type="number" id="income" placeholder="e.g. 40000" required>
        </div>
        <div class="input-field">
            <label>Max Budget (%)</label>
            <input type="number" id="percentage" placeholder="e.g. 30" required>
        </div>
    </div>

    <div class="input-row">
        <div class="input-field">
            <label>Food & Groceries</label>
            <input type="number" id="food" placeholder="e.g. 6000" value="0">
        </div>
        <div class="input-field">
            <label>Travel & Other</label>
            <input type="number" id="other-expenses" placeholder="e.g. 4000" value="0">
        </div>
    </div>

    <div class="input-field">
        <label>Savings Goal</label>
        <input type="number" id="savings" placeholder="e.g. 8000" value="0">
    </div>

    <button class="action-btn" onclick="calculateFairSplit()">Calculate Split</button>

    <div class="result-box" id="result-container">
        <p>Fair Per-Person Split</p>
        <h3 id="final-amount">0</h3>
        <p style="margin-top: 14px;">Full Monthly Expense</p>
        <h3 id="monthly-expense">0</h3>
        <div id="budget-health" class="alert-health" style="display: none;"></div>
        
        <div id="warning-flag" class="alert-msg alert-warning">
            Warning: This split exceeds your chosen income percentage!
        </div>
        <div id="success-flag" class="alert-msg alert-success">
            Great! This split is within your affordable budget.
        </div>
    </div>
</div>

<script>
    function switchTheme() {
        document.body.classList.toggle('dark-mode');
        const btn = document.getElementById('theme-toggle');
        if (document.body.classList.contains('dark-mode')) {
            btn.innerText = '☀️';
        } else {
            btn.innerText = '🌙';
        }
    }

    function getRoommateCount() {
        return Math.max(1, parseInt(document.getElementById('roommates').value) || 1);
    }

    function renderCustomSplitFields() {
        const mode = document.getElementById('split-mode').value;
        const container = document.getElementById('custom-split-fields');
        const roommates = getRoommateCount();

        if (mode !== 'custom') {
            container.innerHTML = '';
            return;
        }

        container.innerHTML = Array.from({ length: roommates }, (_, index) => `
            <div class="input-field">
                <label>Roommate ${index + 1} Amount</label>
                <input type="number" class="custom-share" min="0" placeholder="e.g. ${index === 0 ? '6000' : '5000'}">
            </div>
        `).join('');
    }

    function getBudgetHealth(score) {
        if (score >= 80) return { label: 'Excellent', className: '', color: '#2e7d32' };
        if (score >= 60) return { label: 'Comfortable', className: '', color: '#43a047' };
        if (score >= 40) return { label: 'Tight', className: 'tight', color: '#ef6c00' };
        return { label: 'Risky', className: 'risky', color: '#d32f2f' };
    }

    function calculateBudgetScore(income, housingShare, lifestyleExpenses, savingsGoal, percentage) {
        if (income <= 0) return null;

        const housingPercent = (housingShare / income) * 100;
        const spendingPercent = ((housingShare + lifestyleExpenses) / income) * 100;
        const savingsPercent = (savingsGoal / income) * 100;
        const leftover = income - housingShare - lifestyleExpenses - savingsGoal;

        const housingScore = Math.max(0, 40 - Math.max(0, housingPercent - percentage) * 1.6);
        const spendingScore = Math.max(0, 35 - Math.max(0, spendingPercent - 65) * 1.4);
        const savingsScore = savingsPercent >= 20 ? 25 : savingsPercent >= 10 ? 18 : savingsPercent >= 5 ? 10 : 4;
        const leftoverPenalty = leftover < 0 ? Math.min(25, Math.abs(leftover) / income * 100) : 0;

        return Math.max(0, Math.min(100, Math.round(housingScore + spendingScore + savingsScore - leftoverPenalty)));
    }

    function calculateFairSplit() {
        const rent = parseFloat(document.getElementById('rent').value) || 0;
        const utilities = parseFloat(document.getElementById('utilities').value) || 0;
        const roommates = getRoommateCount();
        const splitMode = document.getElementById('split-mode').value;
        const income = parseFloat(document.getElementById('income').value) || 0;
        const percentage = parseFloat(document.getElementById('percentage').value) || 0;
        const food = parseFloat(document.getElementById('food').value) || 0;
        const otherExpenses = parseFloat(document.getElementById('other-expenses').value) || 0;
        const savingsGoal = parseFloat(document.getElementById('savings').value) || 0;

        const totalCost = rent + utilities;
        let perPersonCost = totalCost / roommates;
        const maxAllowedCost = (income * percentage) / 100;

        if (splitMode === 'custom') {
            const customShares = Array.from(document.querySelectorAll('.custom-share')).map(input => parseFloat(input.value) || 0);
            const customTotal = customShares.reduce((sum, amount) => sum + amount, 0);

            if (customShares.length !== roommates || customShares.some(amount => amount <= 0)) {
                alert('Please enter a custom amount for every roommate.');
                return;
            }

            if (Math.abs(customTotal - totalCost) > 1) {
                alert(`Custom shares must add up to ₹${totalCost.toFixed(2)}.`);
                return;
            }

            perPersonCost = customShares[0];
        }

        document.getElementById('final-amount').innerText = '₹' + perPersonCost.toFixed(2);
        const lifestyleExpenses = food + otherExpenses;
        const fullMonthlyExpense = perPersonCost + lifestyleExpenses;
        const plannedOutflow = fullMonthlyExpense + savingsGoal;
        const budgetScore = calculateBudgetScore(income, perPersonCost, lifestyleExpenses, savingsGoal, percentage);

        document.getElementById('monthly-expense').innerText = '₹' + fullMonthlyExpense.toFixed(2);
        document.getElementById('result-container').style.display = 'block';

        const warningFlag = document.getElementById('warning-flag');
        const successFlag = document.getElementById('success-flag');
        const healthBox = document.getElementById('budget-health');

        if (income > 0 && percentage > 0) {
            if (perPersonCost > maxAllowedCost) {
                warningFlag.style.display = 'block';
                successFlag.style.display = 'none';
            } else {
                warningFlag.style.display = 'none';
                successFlag.style.display = 'block';
            }

            const health = getBudgetHealth(budgetScore);
            const expenseRatio = (fullMonthlyExpense / income) * 100;
            healthBox.className = `alert-health ${health.className}`;
            healthBox.style.display = 'block';
            healthBox.innerHTML = `
                Budget Score: ${budgetScore}/100 — ${health.label}<br>
                Full expense uses ${expenseRatio.toFixed(1)}% of income${savingsGoal > 0 ? `; with savings planned outflow is ₹${plannedOutflow.toFixed(2)}.` : '.'}
                <div class="score-meter"><span style="width: ${budgetScore}%; background: ${health.color};"></span></div>
            `;
        } else {
            warningFlag.style.display = 'none';
            successFlag.style.display = 'none';
            healthBox.style.display = 'none';
        }
    }
</script>

</body>
</html>
