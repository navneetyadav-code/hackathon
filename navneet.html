<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PHP API Connection Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        p {
            color: #666;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        pre {
            margin-top: 20px;
            padding: 15px;
            min-height: 100px;
            background: #111827;
            color: #22c55e;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PHP API Connection Test</h1>

    <p>
        GitHub Pages → InfinityFree PHP API
    </p>

    <button onclick="testAPI()">
        Test API Connection
    </button>

    <pre id="result">Waiting for test...</pre>

</div>

<script>

async function testAPI() {

    const result = document.getElementById("result");

    result.textContent = "Connecting to PHP API...";

    try {

        const response = await fetch(
            "https://navneetyadav.me/test_api",
            {
                method: "GET",
                mode: "cors"
            }
        );

        console.log("HTTP Status:", response.status);
        console.log("Response URL:", response.url);

        const text = await response.text();

        console.log("Raw Response:", text);

        result.textContent =
            "HTTP STATUS: " + response.status +
            "\n\n" +
            "SERVER RESPONSE:\n" +
            text;

    } catch (error) {

        console.error("API ERROR:", error);

        result.textContent =
            "CONNECTION ERROR:\n\n" +
            error.message;
    }
}

</script>

</body>
</html>
