<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Property Matcher</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: url('https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(15, 32, 39, 0.9), rgba(44, 83, 100, 0.8));
    z-index: -1;
}

.glass-card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    width: 460px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    color: #fff;
    margin: 20px 0;
}

.property-img {
    width: 100%;
    height: 200px;
    background: url('https://images.unsplash.com/photo-1502672260266-1c1de2422008?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
    position: relative;
}

.price-tag {
    position: absolute;
    bottom: 15px;
    left: 20px;
    background: rgba(0, 0, 0, 0.75);
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 700;
    backdrop-filter: blur(5px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.card-body {
    padding: 25px 30px;
}

.title-section h1 {
    margin: 0 0 5px 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.title-section p {
    margin: 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    gap: 5px;
}

.roommates-section {
    margin: 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.roommates-section h3 {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.8);
    margin: 0;
}

.avatar-group {
    display: flex;
    align-items: center;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid #2c5364;
    margin-left: -12px;
    background-size: cover;
    background-position: center;
    transition: transform 0.3s ease;
}

.avatar:first-child { margin-left: 0; }
.avatar:hover { transform: translateY(-5px); z-index: 10; }

.avatar-1 { background-image: url('https://randomuser.me/api/portraits/men/32.jpg'); }
.avatar-2 { background-image: url('https://randomuser.me/api/portraits/women/44.jpg'); }
.avatar-3 { background-image: url('https://randomuser.me/api/portraits/men/85.jpg'); }

.avatar-you {
    display: none;
    background-image: url('https://randomuser.me/api/portraits/lego/1.jpg');
    border-color: #00e676;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.advanced-options {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.slider-container {
    margin-bottom: 20px;
}

.slider-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 10px;
    color: rgba(255,255,255,0.9);
}

.slider-header span:last-child {
    font-weight: 700;
    color: #00b4db;
}

input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
}

input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 18px;
    width: 18px;
    border-radius: 50%;
    background: #00b4db;
    cursor: pointer;
    margin-top: -6px;
    box-shadow: 0 0 10px rgba(0, 180, 219, 0.5);
}

input[type=range]::-webkit-slider-runnable-track {
    width: 100%;
    height: 6px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 5px;
}

.room-type-toggle {
    display: flex;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
}

.room-type-toggle button {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'Poppins', sans-serif;
}

.room-type-toggle button.active {
    background: #00b4db;
    color: #fff;
}

.input-group {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 14px;
    padding: 5px;
    display: flex;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.input-group input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 15px 20px;
    color: #fff;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
}

.input-group input:focus {
    outline: none;
}

.input-group input::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

.analyze-btn {
    background: linear-gradient(135deg, #00b4db, #0083b0);
    color: #fff;
    border: none;
    padding: 0 25px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
}

.analyze-btn:hover {
    box-shadow: 0 0 20px rgba(0, 180, 219, 0.5);
    transform: scale(1.02);
}

.result-dashboard {
    display: none;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    animation: slideUp 0.5s ease forwards;
}

@keyframes slideUp {
    0% { transform: translateY(20px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

.result-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 15px;
}

.result-header p {
    margin: 0;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
}

.result-header h2 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.breakdown-text {
    font-size: 11px;
    color: #00b4db;
    margin-top: 4px;
}

.meter-container {
    height: 10px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    margin-bottom: 12px;
}

.meter-fill {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.5s;
}

.status-msg {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    padding: 10px;
    border-radius: 8px;
    margin: 0;
}
</style>
</head>
<body>

<div class="overlay"></div>

<div class="glass-card">
    <div class="property-img">
        <div class="price-tag" id="base-rent" data-value="24000">₹24,000 / month</div>
    </div>
    
    <div class="card-body">
        <div class="title-section">
            <h1>Premium 3BHK Apartment</h1>
            <p>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                Downtown, Sector 15
            </p>
        </div>

        <div class="roommates-section">
            <h3>Current Residents</h3>
            <div class="avatar-group">
                <div class="avatar avatar-1"></div>
                <div class="avatar avatar-2"></div>
                <div class="avatar avatar-3"></div>
                <div class="avatar avatar-you" id="avatar-you"></div>
            </div>
        </div>

        <div class="advanced-options">
            <div class="slider-container">
                <div class="slider-header">
                    <span>Est. Utilities (WiFi, Power)</span>
                    <span id="utility-val">₹3,000</span>
                </div>
                <input type="range" id="utility-slider" min="0" max="10000" step="500" value="3000" oninput="updateUtility(this.value)">
            </div>

            <div class="room-type-toggle">
                <button id="btn-standard" class="active" onclick="setRoomType('standard')">Standard Room</button>
                <button id="btn-master" onclick="setRoomType('master')">Master Bedroom</button>
            </div>
        </div>

        <div class="input-group">
            <input type="number" id="user-income" placeholder="Monthly Income (₹)">
            <button class="analyze-btn" onclick="analyzeMatch()">Analyze</button>
        </div>

        <div class="result-dashboard" id="result-box">
            <div class="result-header">
                <div>
                    <p>Your Monthly Share</p>
                    <h2 id="share-amount">₹0</h2>
                    <div class="breakdown-text" id="breakdown-info"></div>
                </div>
                <div>
                    <p>Income Used</p>
                    <h2 id="percentage-used">0%</h2>
                </div>
            </div>

            <div class="meter-container">
                <div class="meter-fill" id="meter-bar"></div>
            </div>

            <div id="status-text" class="status-msg"></div>
        </div>
    </div>
</div>

<script>
    let currentRoomType = 'standard';
    let currentUtility = 3000;

    function updateUtility(val) {
        currentUtility = parseInt(val);
        document.getElementById('utility-val').innerText = '₹' + currentUtility.toLocaleString();
        if(document.getElementById('result-box').style.display === 'block') {
            analyzeMatch();
        }
    }

    function setRoomType(type) {
        currentRoomType = type;
        if(type === 'standard') {
            document.getElementById('btn-standard').classList.add('active');
            document.getElementById('btn-master').classList.remove('active');
        } else {
            document.getElementById('btn-master').classList.add('active');
            document.getElementById('btn-standard').classList.remove('active');
        }
        if(document.getElementById('result-box').style.display === 'block') {
            analyzeMatch();
        }
    }

    function analyzeMatch() {
        const income = parseFloat(document.getElementById('user-income').value);
        if (!income || income <= 0) return;

        const baseRent = parseFloat(document.getElementById('base-rent').getAttribute('data-value'));
        const totalPeople = 4; 
        
        let userRentShare = 0;
        
        if (currentRoomType === 'master') {
            userRentShare = (baseRent * 0.35); 
        } else {
            userRentShare = (baseRent * 0.2166); 
        }

        const userUtilityShare = currentUtility / totalPeople;
        const totalUserShare = userRentShare + userUtilityShare;
        const percentageUsed = (totalUserShare / income) * 100;

        document.getElementById('avatar-you').style.display = 'block';
        document.getElementById('result-box').style.display = 'block';
        
        document.getElementById('share-amount').innerText = '₹' + Math.round(totalUserShare).toLocaleString();
        document.getElementById('breakdown-info').innerText = `Rent: ₹${Math.round(userRentShare)} | Utilities: ₹${Math.round(userUtilityShare)}`;
        document.getElementById('percentage-used').innerText = percentageUsed.toFixed(1) + '%';

        const meterBar = document.getElementById('meter-bar');
        const statusText = document.getElementById('status-text');
        
        let displayWidth = percentageUsed;
        if(displayWidth > 100) displayWidth = 100;
        
        setTimeout(() => {
            meterBar.style.width = displayWidth + '%';
            
            if (percentageUsed <= 25) {
                meterBar.style.background = '#00e676';
                statusText.style.background = 'rgba(0, 230, 118, 0.2)';
                statusText.style.color = '#00e676';
                statusText.innerText = "Perfect Match! Very affordable for you.";
            } else if (percentageUsed <= 40) {
                meterBar.style.background = '#ffd600';
                statusText.style.background = 'rgba(255, 214, 0, 0.2)';
                statusText.style.color = '#ffd600';
                statusText.innerText = "Manageable, but tight on the budget.";
            } else {
                meterBar.style.background = '#ff1744';
                statusText.style.background = 'rgba(255, 23, 68, 0.2)';
                statusText.style.color = '#ff1744';
                statusText.innerText = "Danger! This exceeds recommended limits.";
            }
        }, 50);
    }
</script>

</body>
</html>
