<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RentMate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            /* RentMate Theme Colors (Indigo & Slate) */
            --auth-primary: #4F46E5; 
            --auth-primary-hover: #4338CA;
            --auth-bg: #F8FAFC; 
            --auth-text: #0F172A; 
            --auth-text-light: #64748B;
            --auth-border: #E2E8F0; 
            --auth-error: #EF4444;
            --auth-success: #10B981;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--auth-bg);
            color: var(--auth-text);
            overflow-x: hidden;
            height: 100vh;
            min-height: 100svh;
        }

        .auth-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            min-height: 100svh;
        }

        /* --- LEFT SIDE: SLIDESHOW --- */
        .auth-sidebar {
            width: 45%;
            position: relative;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #FFF;
        }

        .auth-sidebar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.4), rgba(79, 70, 229, 0.8));
            z-index: 2;
        }

        .auth-slideshow {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .auth-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: authCrossfade 15s infinite ease-in-out;
        }

        /* Rent/Roommate relevant images */
        .auth-slide:nth-child(1) { animation-delay: 0s; }
        .auth-slide:nth-child(2) { animation-delay: 5s; }
        .auth-slide:nth-child(3) { animation-delay: 10s; }

        @keyframes authCrossfade {
            0%, 25% { opacity: 1; transform: scale(1.02); }
            33.33%, 91.66% { opacity: 0; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        .auth-sidebar-content {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 40px;
            max-width: 80%;
        }

        .auth-sidebar-content h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .auth-sidebar-content p {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* --- RIGHT SIDE: FORM AREA --- */
        .auth-main {
            width: 55%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--auth-bg);
            padding: 40px;
            position: relative;
            min-width: 0;
        }

        .auth-form-container {
            width: min(100%, 520px);
            max-width: 520px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--auth-border);
        }

        .auth-logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--auth-primary);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            color: var(--auth-text);
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--auth-text-light);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .auth-input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .auth-input {
            width: 100%;
            padding: 22px 16px 8px;
            border: 1px solid var(--auth-border);
            border-radius: 12px;
            background-color: var(--auth-bg);
            font-size: 16px;
            font-family: inherit;
            color: var(--auth-text);
            transition: all 0.3s ease;
            box-sizing: border-box;
            min-height: 48px;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--auth-primary);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .auth-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: var(--auth-text-light);
            pointer-events: none;
            transition: 0.2s ease all;
        }

        .auth-input:focus ~ .auth-label,
        .auth-input:not(:placeholder-shown) ~ .auth-label {
            top: 14px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--auth-primary);
        }

        .auth-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--auth-primary);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
            min-height: 52px;
        }

        .auth-btn:hover:not(:disabled) {
            background-color: var(--auth-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);
        }

        .auth-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .auth-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: var(--auth-primary);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .auth-links a:hover {
            color: var(--auth-primary-hover);
            text-decoration: underline;
        }

        #responseMessage {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .text-success { color: var(--auth-success); }
        .text-danger { color: var(--auth-error); }

        @media (max-width: 900px) {
            .auth-wrapper { flex-direction: column; }
            .auth-sidebar { width: 100%; height: 30vh; min-height: 250px; }
            .auth-sidebar-content h2 { font-size: 1.8rem; }
            .auth-sidebar-content p { font-size: 0.95rem; }
            .auth-main { width: 100%; height: 70vh; padding: 20px; align-items: flex-start; overflow-y: auto; }
            .auth-form-container { padding: 30px 25px; box-shadow: none; background: transparent; border: none; }
        }

        @media (max-width: 430px) {
            .auth-sidebar { min-height: 200px; }
            .auth-slideshow, .auth-slide { min-height: 200px; }
            .auth-sidebar-content { padding: 18px 16px; }
            .auth-sidebar-content p { display: none; }
            .auth-main { padding: 22px 14px 28px; }
            .auth-links { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <aside class="auth-sidebar">
            <div class="auth-slideshow">
                <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&q=80&w=1000" alt="Modern Apartment" class="auth-slide">
                <img src="https://images.unsplash.com/photo-1529156069898-49953eb1b5ce?auto=format&fit=crop&q=80&w=1000" alt="Happy Roommates" class="auth-slide">
                <img src="https://images.unsplash.com/photo-1502672260266-1c1c2940844f?auto=format&fit=crop&q=80&w=1000" alt="Shared Living Space" class="auth-slide">
            </div>
            <div class="auth-sidebar-content">
                <h2>Welcome Back</h2>
                <p>Log in to manage your rental listings, split costs, and chat with potential roommates effortlessly.</p>
            </div>
        </aside>

        <main class="auth-main">
            <div class="auth-form-container">
                <a href="#" class="auth-logo">RentMate.</a>
                <div class="auth-header">
                    <h1>Log In to Your Account</h1>
                    <p>Enter your details to securely access your portal.</p>
                </div>

                <form id="loginForm">
                    <div class="auth-input-group">
                        <input type="text" id="contact" name="contact" class="auth-input" placeholder=" " required>
                        <label for="contact" class="auth-label">Email or Mobile Number</label>
                    </div>

                    <div class="auth-input-group">
                        <input type="password" id="password" name="password" class="auth-input" placeholder=" " required>
                        <label for="password" class="auth-label">Password</label>
                    </div>

                    <button type="submit" id="loginBtn" class="auth-btn">Sign In</button>
                </form>

                <div id="responseMessage"></div>

                <div class="auth-links">
                    <span>Don't have an account? <a href="signup.html">Sign Up here</a></span>
                    <a href="#">Forgot Password?</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        
        form.addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            const btn = document.getElementById('loginBtn');
            const responseDiv = document.getElementById('responseMessage');
            const contact = document.getElementById('contact').value;
            
            btn.disabled = true;
            btn.innerText = 'Authenticating...';
            responseDiv.innerHTML = '';

            // Mock API Request Simulation
            setTimeout(() => {
                if(contact.trim() !== '') {
                    responseDiv.innerHTML = `<span class="text-success">Login successful! Redirecting...</span>`;
                    // Redirect simulation
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerText = 'Sign In';
                        // window.location.href = 'dashboard.html';
                    }, 1500); 
                } else {
                    responseDiv.innerHTML = `<span class="text-danger">Invalid credentials. Try again.</span>`;
                    btn.disabled = false;
                    btn.innerText = 'Sign In';
                }
            }, 1200);
        });
    </script>
</body>
</html>
