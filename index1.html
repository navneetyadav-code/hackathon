<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentMate - Rent Affordability & Roommate Finder</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        :root {
            /* Theme Colors tailored for Real Estate / Coliving */
            --brand-primary: #4F46E5; /* Indigo */
            --brand-primary-hover: #4338CA;
            --brand-secondary: #F97316; /* Warm Orange Accent */
            --bg-color: #F8FAFC; /* Slate 50 */
            --surface-color: #FFFFFF;
            --text-main: #0F172A; /* Slate 900 */
            --text-muted: #64748B; /* Slate 500 */
            --border-color: #E2E8F0; /* Slate 200 */
            --error-color: #EF4444; /* Red 500 */
            --success-color: #10B981; /* Emerald 500 */
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            display: flex;
        }

        .app-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* --- LEFT SIDE: HERO / SLIDESHOW --- */
        .hero-section {
            width: 45%;
            position: relative;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 60px;
            color: #FFF;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            inset: 0;
            /* Gradient overlay to make text readable and add brand tint */
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
            z-index: 2;
        }

        .slideshow {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: crossfade 15s infinite ease-in-out;
        }

        /* Relevant high-quality Unsplash images for Roommates, PGs, and Flats */
        .slide:nth-child(1) { animation-delay: 0s; }
        .slide:nth-child(2) { animation-delay: 5s; }
        .slide:nth-child(3) { animation-delay: 10s; }

        @keyframes crossfade {
            0%, 25% { opacity: 1; transform: scale(1.03); }
            33.33%, 91.66% { opacity: 0; transform: scale(1.06); }
            100% { opacity: 1; transform: scale(1); }
        }

        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 90%;
        }

        .hero-content h2 {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .hero-content h2 span {
            color: var(--brand-secondary);
        }

        .hero-content p {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.85;
            max-width: 400px;
        }

        /* --- RIGHT SIDE: AUTHENTICATION FORMS --- */
        .form-section {
            width: 55%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px;
            overflow-y: auto;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            background: var(--surface-color);
            padding: 48px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.6);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--brand-primary);
            text-decoration: none;
            margin-bottom: 32px;
        }
        
        .brand-logo svg {
            width: 32px;
            height: 32px;
            fill: var(--brand-secondary);
        }

        /* Tab Switcher for Login/Signup */
        .auth-tabs {
            display: flex;
            background: var(--bg-color);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 32px;
            position: relative;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .auth-tab.active {
            color: var(--brand-primary);
            background: var(--surface-color);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        .auth-view {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }
        
        .auth-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header {
            margin-bottom: 28px;
        }

        .form-header h3 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        
        .input-row {
            display: flex;
            gap: 16px;
        }
        
        .input-row .input-group {
            flex: 1;
        }

        .input-field {
            width: 100%;
            padding: 24px 16px 8px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--surface-color);
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .input-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: all 0.2s ease;
        }

        /* Floating effect */
        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: 14px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--brand-primary);
        }

        /* Host/seeker role toggle */
        .pref-group {
            margin-bottom: 24px;
        }
        
        .pref-label-main {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .pref-options {
            display: flex;
            gap: 10px;
            padding: 5px;
            background: var(--bg-color);
            border-radius: 12px;
        }

        .pref-option {
            flex: 1;
        }

        .pref-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .pref-option label {
            display: block;
            text-align: center;
            padding: 13px 10px;
            border: 1.5px solid transparent;
            border-radius: 9px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pref-option input[type="radio"]:checked + label {
            border-color: var(--brand-primary);
            background-color: var(--surface-color);
            color: var(--brand-primary);
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
        }

        .pref-option input[type="radio"]:focus-visible + label {
            outline: 3px solid rgba(79, 70, 229, 0.2);
            outline-offset: 2px;
        }

        /* Password Toggle */
        .pwd-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }
        
        .pwd-toggle:hover {
            color: var(--brand-primary);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background-color: var(--brand-primary);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: var(--brand-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            font-size: 0.9rem;
        }

        .forgot-link {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 600;
        }
        
        .forgot-link:hover {
            text-decoration: underline;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: var(--brand-primary);
            cursor: pointer;
        }

        .alert-message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
            text-align: center;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        @media (max-width: 1024px) {
            .hero-section { width: 40%; padding: 40px; }
            .form-section { width: 60%; }
        }

        @media (max-width: 768px) {
            body { overflow: auto; }
            .app-wrapper { flex-direction: column; }
            .hero-section {
                width: 100%;
                min-height: 300px;
                padding: 40px 24px;
                justify-content: center;
            }
            .hero-content h2 { font-size: 2.2rem; }
            .form-section {
                width: 100%;
                padding: 24px 16px;
                align-items: flex-start;
                min-height: calc(100vh - 300px);
            }
            .form-container {
                padding: 32px 24px;
                box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
            }
            .input-row { flex-direction: column; gap: 0; }
        }
        
        @media (max-width: 480px) {
            .pref-options { flex-direction: column; }
            .form-footer { flex-direction: column; gap: 16px; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- LEFT SIDE: HERO / SLIDESHOW -->
        <aside class="hero-section">
            <div class="slideshow">
                <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&q=80&w=1200" alt="Modern Apartment" class="slide">
                <img src="https://unsplash.com/photos/light-candle-on-round-white-coffee-table-and-sectional-sofa-GZ5cKOgeIB0?auto=format&fit=crop&q=80&w=1200" alt="Happy Roommates" class="slide">
                <img src="https://images.unsplash.com/photo-1502672260266-1c1c2940844f?auto=format&fit=crop&q=80&w=1200" alt="Shared Living Space" class="slide">
            </div>
            <div class="hero-content">
                <h2>Find your perfect space.<br><span>Split the cost.</span></h2>
                <p>Join RentMate today to discover affordable shared PGs, beautiful flats, and compatible roommates matching your vibe.</p>
            </div>
        </aside>

        <!-- RIGHT SIDE: AUTHENTICATION FORMS -->
        <main class="form-section">
            <!-- Form HTML will go here in Commit 4 -->
        </main>
    </div>

    <script>
        // JavaScript will go here in Commit 5
    </script>
</body>
</html>
