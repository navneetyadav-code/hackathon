<script>
// Mock data 
const propertyData = [
    { name: "Green View PG", price: "5,500", distance: "1.1 km", type: "Shared room", perk: "🍛 Food available", icon: "🏠" },
    { name: "City Heights Flat", price: "7,000", distance: "2 km", type: "Private room", perk: "📶 Wi-Fi included", icon: "🏢" },
    { name: "Student Residency", price: "6,200", distance: "900 m", type: "2 roommates", perk: "⚡ Electricity included", icon: "🏠" }
];

function renderListings(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = propertyData.map(prop => `
        <div class="listing">
            <div class="listing-image">${prop.icon}</div>
            <div class="listing-content">
                <h3>${prop.name}</h3>
                <div class="price">₹${prop.price} / month</div>
                <div class="details">📍 ${prop.distance} from college<br>👥 ${prop.type}<br>${prop.perk}</div>
                <button class="btn">View Details</button>
            </div>
        </div>
    `).join('');
}

window.addEventListener('DOMContentLoaded', () => {
    renderListings('home-listings');
    renderListings('explore-listings');
    
    // Geolocation Request
    const locElement = document.getElementById('current-location');
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(async function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            try {
                // Free reverse geocoding via OpenStreetMap
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await response.json();
                const locationName = data.address.city || data.address.town || data.address.state || "Your Location";
                locElement.innerText = `📍 ${locationName}`;
            } catch (error) {
                locElement.innerText = "📍 Location unavailable";
            }
        }, function(error) {
            locElement.innerText = "📍 Location permission denied";
        });
    } else {
        locElement.innerText = "📍 Geolocation not supported";
    }
});

function openPage(pageName, element) {
    document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));
    document.getElementById(pageName).classList.add("active");
    document.querySelectorAll(".sidebar .nav-item").forEach(item => item.classList.remove("active"));
    document.querySelectorAll(".mobile-nav .nav-item").forEach(item => item.classList.remove("active"));
    if(element) element.classList.add("active");
    window.scrollTo(0, 0);
}
</script>
