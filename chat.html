<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messaging</title>
    <style>
        /* Floating Button Design */
        .floating-chat-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #007bff; /* Medical Blue */
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, background-color 0.3s;
            z-index: 1000;
        }

        .floating-chat-btn:hover {
            transform: scale(1.1);
            background-color: #0056b3;
        }

        /* Chat Pop-up Box Design */
        .chat-popup {
            display: none; 
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 320px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 5px 25px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            overflow: hidden;
            border: 1px solid #eee;
            /* Enhancement: Smooth slide-in animation */
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Design */
        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #ffcccc;
        }

        /* Form Layout */
        .chat-form {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-form input, .chat-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        /* Enhancement: Focus states for better UX */
        .chat-form input:focus, .chat-form textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        .chat-form textarea {
            resize: none;
            height: 80px;
        }

        .submit-btn {
            background-color: #28a745; 
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #218838;
        }

        /* Enhancement: Disabled state for loading */
        .submit-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Enhancement: Added aria-labels for screen reader accessibility -->
    <button class="floating-chat-btn" id="openChatBtn" aria-label="Open messaging widget">💬</button>

    <div class="chat-popup" id="chatPopup" role="dialog" aria-labelledby="chatHeader">
        <div class="chat-header" id="chatHeader">
            Message Doctor
            <button class="close-btn" id="closeChatBtn" aria-label="Close messaging widget">&times;</button>
        </div>
        <form class="chat-form" id="patientForm">
            <input type="text" id="patientName" placeholder="Your Name" required>
            <!-- Enhancement: Added basic phone number pattern validation -->
            <input type="tel" id="patientPhone" placeholder="Mobile Number (e.g. 9876543210)" pattern="[0-9]{10,15}" title="Please enter a valid mobile number (10-15 digits)" required>
            <textarea id="patientMessage" placeholder="Write your message here..." required></textarea>
            <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
        </form>
    </div>

    <script>
        const openBtn = document.getElementById('openChatBtn');
        const closeBtn = document.getElementById('closeChatBtn');
        const chatPopup = document.getElementById('chatPopup');
        const patientForm = document.getElementById('patientForm');
        const submitBtn = document.getElementById('submitBtn');

        openBtn.addEventListener('click', () => {
            chatPopup.style.display = 'block';
            openBtn.style.display = 'none'; 
            // Enhancement: Auto-focus the first input when opened
            document.getElementById('patientName').focus();
        });

        closeBtn.addEventListener('click', () => {
            chatPopup.style.display = 'none';
            openBtn.style.display = 'block'; 
        });

        patientForm.addEventListener('submit', (e) => {
            e.preventDefault(); 

            // Enhancement: Loading state simulation
            const originalBtnText = submitBtn.textContent;
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;

            const name = document.getElementById('patientName').value;
            const phone = document.getElementById('patientPhone').value;
            const message = document.getElementById('patientMessage').value;

            // Simulating a network request delay (1 second)
            setTimeout(() => {
                console.log("Patient Name:", name);
                console.log("Phone Number:", phone);
                console.log("Message:", message);

                alert(`Thank you ${name}! Your message has been sent to the doctor. We will contact you soon.`);

                patientForm.reset();
                chatPopup.style.display = 'none';
                openBtn.style.display = 'block';

                // Reset button state
                submitBtn.textContent = originalBtnText;
                submitBtn.disabled = false;
            }, 1000);
        });
    </script>
</body>
</html>
